# Production / AD example — copy to configs/collector.yaml

tenant_id: "00000000-0000-0000-0000-000000000001"
collector_id: "collector-dc1-01"

http:
  bind: "127.0.0.1:8080"
  static_dir: "web/static"

auth:
  jwt_secret: "change-me-in-production"
  require_local_login: true
  login_rate_limit_per_minute: 10
  ad_bind_login: null

store:
  sqlite_path: "data/collector.db"

ad:
  enabled: true
  ldap_flavor: ad
  domain: "corp.local"
  ldap_uris:
    - "ldaps://dc1.corp.local:636"
  base_dn: "DC=corp,DC=local"
  bind_dn: "CN=svc-collector,OU=Service Accounts,DC=corp,DC=local"
  bind_password_ref: "COLLECTOR_AD_BIND_PASSWORD"
  sync_interval_secs: 3600
  page_size: 1000
  use_usn_changed: true
  allow_insecure_ldap: false

server:
  ingest_base_url: "https://server.example.com"
  api_key_ref: "COLLECTOR_SERVER_API_KEY"
  mtls_cert_path: null
  mtls_key_path: null
  heartbeat_interval_secs: 60

logging:
  level: "info"
  format: "text"
