apiVersion: apps/v1
kind: Deployment
metadata:
  name: server-ingest
  namespace: identity-bridge
  labels:
    app: server-ingest
    tier: ingestion
spec:
  replicas: 2
  selector:
    matchLabels:
      app: server-ingest
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: server-ingest
        tier: ingestion
    spec:
      serviceAccountName: server-ingest
      containers:
        - name: server-ingest
          image: identity-bridge/server-ingest:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          env:
            - name: KAFKA_BROKERS
              valueFrom:
                configMapKeyRef:
                  name: kafka-config
                  key: brokers
            - name: KAFKA_TOPIC_EVENTS
              valueFrom:
                configMapKeyRef:
                  name: kafka-config
                  key: topic_events
            - name: KAFKA_TOPIC_CATALOG
              valueFrom:
                configMapKeyRef:
                  name: kafka-config
                  key: topic_catalog
            - name: KAFKA_TOPIC_HEARTBEAT
              valueFrom:
                configMapKeyRef:
                  name: kafka-config
                  key: topic_heartbeat
            - name: KAFKA_PRODUCER_ACKS
              valueFrom:
                configMapKeyRef:
                  name: kafka-config
                  key: producer_acks
            - name: KAFKA_PRODUCER_COMPRESSION
              valueFrom:
                configMapKeyRef:
                  name: kafka-config
                  key: producer_compression
            - name: KAFKA_PRODUCER_LINGER_MS
              valueFrom:
                configMapKeyRef:
                  name: kafka-config
                  key: producer_linger_ms
            - name: KAFKA_SCRAM_USERNAME
              valueFrom:
                secretKeyRef:
                  name: server-ingest-secrets
                  key: msk_scram_username
            - name: KAFKA_SCRAM_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: server-ingest-secrets
                  key: msk_scram_password
            - name: COLLECTOR_API_KEYS
              valueFrom:
                secretKeyRef:
                  name: server-ingest-secrets
                  key: collector_api_keys
            - name: KAFKA_AUTH_MODE
              value: none
            - name: KAFKA_TLS
              value: "false"
            - name: HTTP_BIND
              value: "0.0.0.0:8080"
            - name: LOG_LEVEL
              value: info
            - name: LOG_FORMAT
              value: json
          livenessProbe:
            httpGet:
              path: /health/live
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
