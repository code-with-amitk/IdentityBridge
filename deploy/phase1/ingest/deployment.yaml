apiVersion: apps/v1
kind: Deployment
metadata:
  name: server-ingest
  namespace: identity-bridge
  labels:
    app: server-ingest
    tier: ingestion
spec:
  replicas: 8
  selector:
    matchLabels:
      app: server-ingest
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 10%
      maxUnavailable: 5%
  template:
    metadata:
      labels:
        app: server-ingest
        tier: ingestion
    spec:
      serviceAccountName: server-ingest
      tolerations:
        - key: workload
          operator: Equal
          value: ingest
          effect: NoSchedule
      nodeSelector:
        workload: ingest
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app: server-ingest
                topologyKey: topology.kubernetes.io/zone
      containers:
        - name: server-ingest
          # Stub until identity-bridge/server-ingest Rust image (Phase 5)
          image: nginx:1.27-alpine
          ports:
            - name: http
              containerPort: 8080
          resources:
            requests:
              cpu: "2"
              memory: 4Gi
            limits:
              cpu: "4"
              memory: 8Gi
          volumeMounts:
            - name: stub-nginx
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: default.conf
              readOnly: true
          env:
            - name: KAFKA_BROKERS
              valueFrom:
                configMapKeyRef:
                  name: kafka-config
                  key: brokers
            - name: KAFKA_TOPIC_EVENTS
              valueFrom:
                configMapKeyRef:
                  name: kafka-config
                  key: topic_events
            - name: KAFKA_TOPIC_CATALOG
              valueFrom:
                configMapKeyRef:
                  name: kafka-config
                  key: topic_catalog
            - name: KAFKA_TOPIC_HEARTBEAT
              valueFrom:
                configMapKeyRef:
                  name: kafka-config
                  key: topic_heartbeat
            - name: KAFKA_SCRAM_USERNAME
              valueFrom:
                secretKeyRef:
                  name: server-ingest-secrets
                  key: msk_scram_username
            - name: KAFKA_SCRAM_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: server-ingest-secrets
                  key: msk_scram_password
            - name: HTTP_BIND
              value: "0.0.0.0:8080"
            - name: RUST_LOG
              value: info
          livenessProbe:
            httpGet:
              path: /health/live
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
      volumes:
        - name: stub-nginx
          configMap:
            name: server-ingest-stub-nginx
