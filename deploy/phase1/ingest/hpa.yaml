apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: server-ingest
  namespace: identity-bridge
  labels:
    app: server-ingest
    tier: ingestion
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: server-ingest
  minReplicas: 4
  maxReplicas: 25
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 60
