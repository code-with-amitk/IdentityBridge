# Optional alternative to eksctl managed node group — requires Karpenter installed on cluster.
# Apply: kubectl apply -f deploy/phase0/karpenter/nodepool-ingest.yaml

apiVersion: karpenter.sh/v1
kind: NodePool
metadata:
  name: ingest
spec:
  template:
    metadata:
      labels:
        workload: ingest
    spec:
      taints:
        - key: workload
          value: ingest
          effect: NoSchedule
      requirements:
        - key: karpenter.sh/capacity-type
          operator: In
          values: ["on-demand"]
        - key: kubernetes.io/arch
          operator: In
          values: ["arm64"]
        - key: node.kubernetes.io/instance-type
          operator: In
          values:
            - m7g.xlarge
            - m7g.2xlarge
            - c7g.xlarge
            - c7g.2xlarge
        - key: topology.kubernetes.io/zone
          operator: In
          values:
            - ap-south-1a
            - ap-south-1b
            - ap-south-1c
      nodeClassRef:
        group: karpenter.k8s.aws
        kind: EC2NodeClass
        name: ingest
  limits:
    cpu: "48"
    memory: 96Gi
  disruption:
    consolidationPolicy: WhenEmptyOrUnderutilized
    consolidateAfter: 5m

---
apiVersion: karpenter.k8s.aws/v1
kind: EC2NodeClass
metadata:
  name: ingest
spec:
  amiSelectorTerms:
    - alias: al2023@latest
  subnetSelectorTerms:
    - tags:
        karpenter.sh/discovery: identity-bridge
  securityGroupSelectorTerms:
    - tags:
        karpenter.sh/discovery: identity-bridge
  tags:
    workload: ingest
    app.kubernetes.io/part-of: identity-bridge
