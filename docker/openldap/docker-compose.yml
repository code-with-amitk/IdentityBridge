services:
  openldap:
    image: osixia/openldap:1.5.0
    container_name: ib-test-ldap
    ports:
      - "1389:389"
      - "1636:636"
    environment:
      LDAP_ORGANISATION: "Example"
      LDAP_DOMAIN: "example.local"
      LDAP_ADMIN_PASSWORD: "admin"
    volumes:
      # Mount a single LDIF file (not the whole custom/ dir).
      # --copy-service copies /container/service → /container/run before sed/chown.
      - ./seed/50-users.ldif:/container/service/slapd/assets/config/bootstrap/ldif/custom/50-users.ldif:ro
    command: --copy-service
